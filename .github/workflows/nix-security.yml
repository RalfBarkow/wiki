name: Nix security release

on:
  push:
    branches: [security/wiki-0.41.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - run: nix flake check --no-update-lock-file --print-build-logs
      - name: Verify both locked server consumers
        env:
          SHARED: github:RalfBarkow/wiki/24fbf03a473deb98c23d06048b861f64d847709a
          DREYECK: github:RalfBarkow/wiki/9c0a98cddbd83e5dc22bfe2093b2043d7edf3530
          RALF: github:RalfBarkow/wiki/d8c2b65a76c0ccc37d20d1de7ae4d3f314a2e528
        run: |
          evaluate() {
            nix eval --no-update-lock-file --raw "$1#packages.x86_64-linux.$2.$3"
          }
          for output in wiki default nginx; do
            expected="$(evaluate "$SHARED" "$output" outPath)"
            for consumer in "$DREYECK" "$RALF"; do
              actual="$(evaluate "$consumer" "$output" outPath)"
              test "$actual" = "$expected"
              printf '%s %s %s\n' "$consumer" "$output" "$actual"
              test "$(nix eval --no-update-lock-file --json "$consumer#nixosModules.nginx-security" --apply builtins.isFunction)" = true
            done
          done
          test "$(evaluate "$SHARED" wiki version)" = 0.41.1
          test "$(evaluate "$SHARED" nginx version)" = 1.30.7
          nix eval --json --expr '
            let
              release = builtins.getFlake "github:RalfBarkow/wiki/24fbf03a473deb98c23d06048b861f64d847709a";
              configured = enable: (release.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  release.nixosModules.nginx-security
                  { system.stateVersion = "26.05"; services.nginx.enable = enable; }
                ];
              }).config;
              accepted = cfg: (builtins.head (builtins.filter
                (a: a.message == "Enable NGINX and select the shared NGINX 1.30.7 package for this server.")
                cfg.assertions)).assertion;
            in {
              enabledAccepted = accepted (configured true);
              disabledRejected = !(accepted (configured false));
            }
          ' | jq -e '.enabledAccepted and .disabledRejected'
